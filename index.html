<html lang="en"><head><meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:var(--fs)/1.6 'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{line-height:1.12;margin:0 0 .5em;letter-spacing:-.02em}h1{font-size:clamp(2.2rem,5.4vw,3.8rem);font-weight:800}h2{font-size:clamp(1.7rem,3.4vw,2.4rem)}
a,button{font:inherit;color:inherit}:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav{max-width:1120px;margin:auto;display:flex;align-items:center;gap:6px;padding:10px 20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.3rem;margin-right:auto;text-decoration:none}.logo b{color:var(--blue)}
nav a.l{padding:8px 12px;border-radius:99px;text-decoration:none;font-weight:600;font-size:.92em}nav a.l:hover,nav a.on{background:var(--lav)}
select,input,textarea{font:inherit;padding:11px 14px;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);width:100%}
nav select{width:auto;padding:6px 10px}
.btn{display:inline-block;border:0;cursor:pointer;text-decoration:none;font-weight:800;padding:14px 26px;border-radius:99px;background:var(--blue);color:#fff;box-shadow:0 10px 24px -8px #4169f5aa;transition:transform .15s}.btn:hover{transform:translateY(-2px)}
.btn.o{background:var(--coral);box-shadow:0 10px 24px -8px #ff8066aa;color:#101A36}.btn.g{background:var(--lav);color:var(--ink);box-shadow:none}.btn.s{padding:9px 18px;font-size:.9em}
main{max-width:1120px;margin:auto;padding:28px 20px 70px}
.grad{background:linear-gradient(90deg,var(--blue),#9b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:center;min-height:70vh}
.badge{display:inline-block;background:var(--lav);padding:7px 16px;border-radius:99px;font-weight:600;font-size:.9em;margin-bottom:18px}
.badge i{display:inline-block;font-style:normal;animation:beat 1.6s infinite}@keyframes beat{50%{transform:scale(1.3)}}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.ticks{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:.9em;font-weight:600}
.stage{position:relative;aspect-ratio:1;border-radius:44px;background:radial-gradient(circle at 30% 20%,#9b8cff,#4169F5 45%,#101A36);box-shadow:0 40px 80px -30px #4169f5;overflow:hidden}
.stage .p{position:absolute;font-size:clamp(5rem,13vw,9rem);line-height:1;filter:drop-shadow(0 18px 20px #0006)}
.fl{position:absolute;background:#ffffffee;color:#101A36;border-radius:18px;padding:10px 14px;font-weight:600;font-size:.82em;box-shadow:0 14px 30px -10px #0007;animation:fy 5s ease-in-out infinite}.fl:nth-of-type(2){animation-delay:-2s}.fl:nth-of-type(3){animation-delay:-3.5s}
@keyframes fy{50%{transform:translateY(-12px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px}
.svc{cursor:pointer;transition:.2s}.svc:hover{border-color:var(--blue);transform:translateY(-3px)}.svc .ic{font-size:2rem}.svc p,.mute{color:var(--mute);margin:.3em 0 .8em}
.tag{display:inline-block;background:var(--lav);border-radius:99px;padding:2px 11px;font-size:.78em;font-weight:600;margin:2px 3px 2px 0}.ok{color:#0a8a4a;font-weight:800}
.av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:2rem;background:var(--lav)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin:16px 0 24px}
.demo{background:#fff2cf;color:#5a4300;border-radius:14px;padding:9px 14px;font-size:.85em;margin-bottom:18px}
.steps{display:flex;gap:6px;margin-bottom:20px}.steps span{flex:1;height:8px;border-radius:9px;background:var(--line)}.steps .d{background:var(--blue)}
.opt{display:block;width:100%;text-align:left;padding:14px 18px;margin:8px 0;border:2px solid var(--line);border-radius:18px;background:var(--card);cursor:pointer}.opt.sel{border-color:var(--blue);background:var(--lav)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.big{font-size:2rem;font-weight:800}
.vid{background:#101A36;border-radius:28px;aspect-ratio:16/9;display:grid;place-items:center;color:#fff;font-size:4rem;position:relative}.vid small{position:absolute;bottom:14px;left:18px;font-size:.9rem}
.err{color:#c0262d;font-weight:600;min-height:1.4em}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}#toast.on{opacity:1}
label{display:block;margin:10px 0;font-weight:600}
.sb{border:0;background:none;font-size:1.9rem;cursor:pointer;color:var(--line);padding:0 2px;transition:transform .15s}.sb.on{color:var(--coral)}.sb:hover{transform:scale(1.2)}
.ob{width:46px;height:54px;text-align:center;font-size:1.4rem;padding:0;border-radius:14px}
.br{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:.9em}.tr{height:10px;border-radius:9px;background:var(--lav);overflow:hidden}.tr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#9b5cf6);transition:width 1s}
.chip{background:#d8f5e4;color:#0a6b3a;border-radius:99px;padding:3px 12px;font-weight:800;font-size:.85em}
.pop{animation:pop .6s cubic-bezier(.2,1.4,.4,1)}@keyframes pop{from{transform:scale(.7);opacity:0}}
@media(max-width:800px){.br{grid-template-columns:100px 1fr 40px}.hero,.two{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}}
</style></head><body>

home(){const t=T[lang];return`<section class="hero"><div><span class="badge"><i>❤️</i> Technology with a Human Touch</span>

const keep=()=>{const y=scrollY;render();scrollTo(0,y)};

const bar=(l,v)=>`<div class="br"><span>${l}</span><div class="tr"><i data-w="${v*20}"></i></div><b>${(+v).toFixed(1)}</b></div>`;

function post(){requestAnimationFrame(()=>document.querySelectorAll('.tr i[data-w]').forEach(i=>i.style.width=i.dataset.w+'%'));const a=$('#auth');if(a)a.textContent=me?'Log out ('+me.name.split(' ')[0]+')':'Login / Sign up';const c=$('#bc');if(c)c.textContent=N.length?' '+N.length:''}
setInterval(()=>{['ph','em'].forEach(ch=>{const v=ver[ch],e=$('#t_'+ch);if(!v||!e)return;if(v.left>0)v.left--;const r=v.code?Math.max(0,Math.round((v.exp-Date.now())/1000)):0;e.textContent=(v.left>0?'Resend in '+v.left+'s · ':'')+(v.code?(r>0?'Code expires in '+Math.floor(r/60)+':'+String(r%60).padStart(2,'0'):'Code expired. Request a new one.'):'')})},1000);
function vView(){const u=U.find(x=>x.id===auth.uid);const c=(ch,l,val)=>{const v=ver[ch]=ver[ch]||{sent:0,left:0,att:0};return`<div class="card" style="margin-bottom:14px"><b>${l}</b> <span class="mute">${val}</span> ${u[ch+'Ok']?'<span class="chip ok">✓ Verified</span>':`<button class="btn g s" data-chg="${ch}">Change</button>`}${u[ch+'Ok']?'':`<div class="row" style="margin:12px 0 6px">${[0,1,2,3,4,5].map(i=>`<input class="ob" data-o="${ch}" maxlength="1" inputmode="numeric" aria-label="Digit ${i+1}">`).join('')}</div><button class="btn s" data-send="${ch}">${v.sent?'Resend OTP':'Send OTP'}</button> <button class="btn o s" data-vf="${ch}">Verify</button><p class="mute" id="t_${ch}" style="margin:8px 0 0"></p>${v.code?`<div class="demo" style="margin-top:8px">Simulated ${ch==='ph'?'SMS':'email'}: your code is <b>${v.code}</b></div>`:''}<p class="err" id="e_${ch}" role="alert"></p>`}</div>`};return`<div style="max-width:640px;margin:auto"><h2>Verify your account</h2><p class="mute">Both checks are required before your account is fully verified.</p>${c('ph','Mobile',u.mob)}${c('em','Email',u.email)}</div>`}
function otp(ch,act){const u=U.find(x=>x.id===auth.uid),v=ver[ch]=ver[ch]||{sent:0,left:0,att:0},err=m=>$('#e_'+ch).textContent=m;
if(act==='send'){if(v.sent>=3)return err('Too many requests. Please try again later.');if(v.left>0)return err('Please wait '+v.left+' seconds.');v.code=String(100000+Math.floor(Math.random()*9e5));v.exp=Date.now()+12e4;v.left=30;v.sent++;v.att=0;return keep()}
if(!v.code)return err('Tap Send OTP first.');if(v.att>=3)return err('Too many wrong attempts. Request a new code.');if(Date.now()>v.exp)return err('This code has expired. Request a new one.');
const g=[...document.querySelectorAll(`.ob[data-o="${ch}"]`)].map(i=>i.value).join('');if(g!==v.code){v.att++;return err('That code doesn’t match. '+(3-v.att)+' attempts left.')}
u[ch+'Ok']=true;v.code=null;note(ch==='ph'?'Phone number verified':'Email verified');if(u.phOk&&u.emOk){me=u;auth.step='done';note('Account fully verified')}keep()}
function signup(){const g=i=>(($('#'+i)||{}).value||'').trim(),w=auth.role==='worker',e=m=>$('#ae').textContent=m;
const u={id:'u'+Date.now(),role:auth.role,name:g('f_name'),mob:g('f_mob'),email:g('f_em').toLowerCase(),pw:$('#f_pw').value,photo:($('#f_ph').files[0]||{}).name||''};
if(u.name.length<2)return e('Please enter your full name.');if(!/^\d{10}$/.test(u.mob))return e('Mobile number must be 10 digits.');if(!/^\S+@\S+\.\S+$/.test(u.email))return e('Please enter a valid email.');if(U.some(x=>x.email===u.email))return e('This email is already registered. Try logging in.');
if(u.pw.length<8||!/\d/.test(u.pw))return e('Password needs 8+ characters and a number.');if(u.pw!==$('#f_pw2').value)return e('Passwords don’t match.');
if(w){Object.assign(u,{college:g('f_col'),cid:g('f_cid'),skills:g('f_sk'),langs:g('f_lg'),loc:g('f_loc'),price:+g('f_pr')});if(!u.college||!u.cid||!u.skills||!u.langs||!u.loc)return e('Please complete every Tech Buddy field.');if(!(u.price>0))return e('Enter your hourly price.')}else{Object.assign(u,{city:g('f_city'),addr:g('f_addr'),lang:g('f_lang')});if(!u.city||!u.addr||!u.lang)return e('Please add your city, address and language.')}

function signin(){const em=$('#f_em').value.trim().toLowerCase(),pw=$('#f_pw').value,e=m=>$('#ae').textContent=m;

const u=U.find(x=>x.email===em&&x.pw===pw);if(!u)return e('Email or password is incorrect.');if(u.sus)return e('This account is suspended. Contact support.');
if(!u.phOk||!u.emOk){auth={tab:'in',role:u.role,step:'verify',uid:u.id};ver={};return render()}
me=u;note('Welcome back, '+u.name.split(' ')[0]);location.hash=u.role==='worker'?'#student':'#senior'}
function submitRate(){const s=sessions.find(x=>x.id===rc.sid),c=rc.role==='customer',cats=c?CC:WC,e=m=>$('#re').textContent=m;
if(!s||!s.done||(c?s.cr:s.wr))return e('This session can’t be rated.');if(cats.some(k=>!rt[k]))return e('Please rate every category from 1 to 5 stars.');const t=$('#rtext').value.trim();if(t.length<10)return e('Please write a short review (10+ characters).');
const sc={};cats.forEach(k=>sc[k]=rt[k]);RV.push({sid:s.id,from:c?'customer':'worker',to:c?s.b:'Mrs. Sharma',sc,avg:cats.reduce((a,k)=>a+rt[k],0)/7,text:t,ts:new Date().toLocaleDateString(),vis:false});
const rp=$('#rrep').value.trim();if(rp){RP.unshift({id:'p'+Date.now(),what:(c?'Customer':'Tech Buddy')+' report: '+rp.slice(0,60),st:'Open'});note('Report received. Status updates will appear here.')}
c?s.cr=1:s.wr=1;
if(s.cr&&s.wr){RV.filter(r=>r.sid===s.id).forEach(r=>r.vis=true);note('Customer rating received');note('Tech Buddy rating received')}else toast('Submitted. Your review stays hidden until the other side submits.');
rt={};location.hash=c?'#senior':'#student'}
Object.assign(V,{
login(){if(auth.step==='verify')return vView();if(auth.step==='done')return`<div class="card pop" style="text-align:center;max-width:560px;margin:auto"><div class="big">✅ Fully verified</div><p>Phone and email are both verified. Your account is active.</p><a class="btn" href="#${me&&me.role==='worker'?'student':'senior'}">Go to my dashboard</a></div>`;
const up=auth.tab==='up',w=auth.role==='worker';
return`<div class="card" style="max-width:640px;margin:auto"><h2>${up?'Create your account':'Welcome back'}</h2><div class="demo">Demo only: OTPs are simulated and accounts live in this browser tab. Admin demo: admin@techbuddy.demo / Admin@123</div><div class="row" style="margin:0 0 12px"><button class="btn ${up?'g':''} s" data-tab="in">Log in</button><button class="btn ${up?'':'g'} s" data-tab="up">Sign up</button></div>${up?`<div class="row" style="margin:0"><button class="opt ${w?'':'sel'}" style="flex:1" data-role="customer">👵 I’m a customer</button><button class="opt ${w?'sel':''}" style="flex:1" data-role="worker">🧑‍🎓 I’m a Tech Buddy</button></div>${fld('f_name','Full name')}<label>Profile photo<input id="f_ph" type="file" accept="image/*"></label>${fld('f_mob','Mobile number','tel','10 digits')}${w?fld('f_col','College name')+fld('f_cid','College ID')+fld('f_sk','Skills','text','UPI, WhatsApp')+fld('f_lg','Languages','text','Bengali, English')+fld('f_loc','Location')+fld('f_pr','Hourly price (₹)','number'):fld('f_city','City')+fld('f_addr','Address')+fld('f_lang','Preferred language')}${fld('f_em','Email','email')}${fld('f_pw','Password (8+ characters, with a number)','password')}${fld('f_pw2','Confirm password','password')}`:fld('f_em','Email','email')+fld('f_pw','Password','password')}<p class="err" id="ae" role="alert"></p><button class="btn" data-${up?'su':'li'}>${up?'Create account':'Log in'}</button></div>`},
rate(){const s=rc&&sessions.find(x=>x.id===rc.sid);if(!s||!s.done)return`<div class="card">You can rate a session only after it is completed. <a href="#senior">Back to my sessions</a></div>`;
const c=rc.role==='customer',cats=c?CC:WC;if(c?s.cr:s.wr)return`<div class="card">You already submitted your review for this session.</div>`;
return`<h2>${c?'How was your Tech Buddy experience?':'How was your experience with this customer?'}</h2><p class="mute">${s.svc}. Rate the session only, never appearance, age, religion, gender or disability. Ratings stay hidden until both sides submit or 7 days pass.</p><div class="card">${cats.map(k=>`<div class="two" style="align-items:center"><span>${k}</span>${stars(k)}</div>`).join('')}<label>Your review<textarea id="rtext" rows="4" placeholder="${c?'My Tech Buddy explained everything patiently…':'The customer was respectful and cooperative…'}">${rt.text||''}</textarea></label>${c?'':'<label>Private note to administration (optional)<textarea rows="2"></textarea></label>'}<label>Report a problem (optional)<textarea id="rrep" rows="2" placeholder="Describe the issue"></textarea></label><label>Evidence photo (optional)<input type="file" accept="image/*"></label><p class="err" id="re" role="alert"></p><button class="btn o" data-sub>Submit ${c?'review':'rating'}</button></div>`},
profile(){const q=new URLSearchParams(location.hash.split('?')[1]||''),b=B.find(x=>x.id==q.get('w')),n=b?b.n:'Mrs. Sharma',r=b?b.r:4.7,vs=RV.filter(x=>x.vis&&!x.hid&&x.to===n);
const cats=b?[['Technical Knowledge',0],['Patience',.1],['Communication',-.1],['Punctuality',-.2]]:[['Behaviour',0],['Respectfulness',.1],['Communication',-.1],['Cooperation',.1]];
const samp=b?['Patient and clear. WhatsApp video calls finally make sense.','Arrived on time and never rushed me.']:['Respectful and clear about the problem.','Cooperative and pleasant session.'];
return`<div class="two"><div class="card"><div class="av" style="width:90px;height:90px;font-size:3rem">${b?b.e:'👵🏽'}</div><h2 style="margin-top:12px">${n}</h2>${b?`<span class="ok">✓ College ID checked (demo)</span><p class="mute">${b.c}</p>`:'<p class="mute">Customer · Kolkata</p>'}<div class="big">${r}/5 <span style="color:var(--coral)">${starsRO(r)}</span></div><p class="mute">${b?(b.rv*1.3|0)+' completed sessions · '+b.rv+' customer reviews':'12 completed bookings · 9 worker reviews'}</p>${b?`<button class="btn" data-book="${b.id}">Book session</button>`:''}<div class="demo" style="margin-top:14px">Sample ratings are illustrative, not real user feedback.</div></div><div class="card"><h3>Rating breakdown</h3>${cats.map(c=>bar(c[0],Math.min(5,r+c[1]))).join('')}<h3 style="margin-top:18px">Distribution</h3>${[5,4,3,2,1].map((s,i)=>{const p=[70,20,6,3,1][i];return`<div class="br"><span>${s}★</span><div class="tr"><i data-w="${p}"></i></div><b>${p}%</b></div>`}).join('')}</div></div><h3 style="margin-top:28px">Recent reviews</h3>${vs.map(x=>`<div class="card" style="margin-bottom:10px"><b>${starsRO(x.avg)}</b> ${x.text}<br><span class="mute">Demo session ${x.sid} · ${x.ts}</span> <button class="btn g s" data-rpt="${x.sid}">Report review</button></div>`).join('')}${samp.map(t=>`<div class="card" style="margin-bottom:10px">${starsRO(r)} “${t}” <span class="tag">Illustrative sample</span></div>`).join('')}`},
alerts(){return`<h2>Notifications</h2>${N.length?N.map(n=>`<div class="card" style="margin-bottom:10px">🔔 ${n.m} <span class="mute">· ${n.ts}</span></div>`).join(''):'<div class="card">Nothing new. Verification, booking and review updates appear here.</div>'}`},
admin(){if(!me||me.role!=='admin')return`<div class="card">Admin access only. <a href="#login">Log in</a> with the demo admin account.</div>`;
const all=[...SAMPLE.map(x=>({...x,demo:1})),...U.map(x=>({id:x.id,name:x.name,role:x.role,st:x.phOk&&x.emOk?'Verified':'Pending',sus:x.sus}))],avg=RV.length?(RV.reduce((a,r)=>a+r.avg,0)/RV.length).toFixed(1):'4.8';
return`<h2>Admin dashboard</h2><div class="grid">${[['Users',all.length],['Workers',all.filter(x=>x.role==='worker').length],['Customers',all.filter(x=>x.role==='customer').length],['Completed sessions',sessions.filter(s=>s.done).length+86],['Avg rating',avg],['Open reports',RP.filter(r=>r.st!=='Resolved').length]].map(x=>`<div class="card"><div class="big">${x[1]}</div><span class="mute">${x[0]}</span></div>`).join('')}</div><h3 style="margin-top:26px">Accounts</h3>${all.map(x=>`<div class="card" style="margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>${x.name}</b><span class="tag">${x.role}</span><span class="tag">${x.st}</span>${x.demo?'<span class="tag">Demo</span>':''}<button class="btn g s" style="margin-left:auto" data-sus="${x.id}">${x.sus?'Reinstate':'Suspend after review'}</button></div>`).join('')}<h3>Reports and complaints</h3>${RP.map(r=>`<div class="card" style="margin-bottom:8px">${r.what} <span class="tag">${r.st}</span><br><button class="btn g s" data-inv="${r.id}">Investigate</button> <button class="btn s" data-res="${r.id}">Resolve</button></div>`).join('')}<h3>Reviews</h3>${RV.length?RV.map((r,i)=>`<div class="card" style="margin-bottom:8px">${r.from} → ${r.to}: ${starsRO(r.avg)} ${r.hid?'(removed)':r.vis?'':'(hidden until both submit)'}<br>${r.text}<br><button class="btn g s" data-rm="${i}">Remove review</button></div>`).join(''):'<div class="card mute">Reviews submitted in this demo appear here.</div>'}<details class="card" style="margin-top:16px"><summary><b>Database structure</b></summary><pre style="overflow-x:auto;font-size:.8em">users(id, role, name, email, phone, status)\ncustomer_profiles(user_id, city, address, language)\nworker_profiles(user_id, college, college_id, skills, languages, location, hourly_price)\nphone_verifications / email_verifications(user_id, code_hash, expires_at, attempts, verified_at)\nbookings(id, customer_id, worker_id, status, starts_at)\nsessions(id, booking_id, started_at, completed_at)\ncustomer_ratings / worker_ratings(id, booking_id, customer_id, worker_id, category, stars, review_text, created_at)\nreviews(id, booking_id, author_id, visible, created_at)\nnotifications(id, user_id, type, body, read_at)\nreports(id, reporter_id, target_id, booking_id, status, evidence_url)\n-- RLS: insert on ratings only when auth.uid() is a party to a booking\n-- with status='completed'; UNIQUE(booking_id, author_id).</pre></details>`}});
app.addEventListener('click',e=>{const t=e.target.closest('button,#auth');if(!t)return;const d=t.dataset;
if(t.id==='auth'&&me){e.preventDefault();me=null;auth={tab:'in',role:'customer',step:'form',uid:null};location.hash='#home';return post()}
if(d.tab){auth.tab=d.tab;return render()}if(d.role){auth.role=d.role;return render()}
if(d.hasOwnProperty('su'))return signup();if(d.hasOwnProperty('li'))return signin();
if(d.send)return otp(d.send,'send');if(d.vf)return otp(d.vf,'vf');
if(d.chg){const u=U.find(x=>x.id===auth.uid),ph=d.chg==='ph',v=prompt(ph?'New 10-digit mobile number':'New email address');if(!v)return;if(ph?!/^\d{10}$/.test(v):!/^\S+@\S+\.\S+$/.test(v))return toast('That doesn’t look valid.');ph?u.mob=v:u.email=v.toLowerCase();u[d.chg+'Ok']=false;ver[d.chg]=null;toast('Updated. Please verify again.');return render()}

if(d.rate){const [r,s]=d.rate.split('|');rc={role:r,sid:s};rt={};location.hash='#rate';return}
if(d.done){const s=sessions.find(x=>x.id===d.done);s.done=1;s.st='Completed';note('Session completed. Reminder: please rate your Tech Buddy within 7 days.');return render()}

if(d.rpt){RP.unshift({id:'p'+Date.now(),what:'Review reported (session '+d.rpt+')',st:'Open'});return note('Review reported. Updates will appear here.')}
if(d.sus){const x=[...SAMPLE,...U].find(y=>y.id===d.sus);x.sus=x.sus?0:1;toast(x.sus?'Account suspended':'Account reinstated');return render()}
if(d.inv||d.res){const r=RP.find(y=>y.id===(d.inv||d.res));r.st=d.res?'Resolved':'Investigating';note('Report status updated: '+r.st);return render()}
if(d.rm!==undefined){RV[+d.rm].hid=1;return render()}
if(d.hasOwnProperty('pay'))note('Booking confirmed. Reminder sent.')});
app.addEventListener('input',e=>{const o=e.target;if(o.classList.contains('ob')){o.value=o.value.replace(/\D/g,'');if(o.value&&o.nextElementSibling)o.nextElementSibling.focus()}if(o.id==='rtext')rt.text=o.value});

function render(){const r=(location.hash||'#home').slice(1).split('?')[0];const v=V[r]?r:'home';app.innerHTML=V[v]();document.querySelectorAll('nav a.l').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+v));scrollTo(0,0);post()}

addEventListener('hashchange',render);
app.addEventListener('input',e=>{const i=e.target.id;if(i==='fq')ff.q=e.target.value;if(i==='fm')ff.m=e.target.value;if(i==='fl')ff.l=e.target.value;if(i==='fp')ff.p=+e.target.value;if(['fq','fm','fl','fp'].includes(i)){const p=e.target.selectionStart;const y=scrollY;render();scrollTo(0,y);const n=$('#'+i);n.focus();try{n.setSelectionRange(p,p)}catch(_){}}});
app.addEventListener('click',e=>{const t=e.target.closest('button,.svc,a');if(!t)return;const d=t.dataset,err=m=>{const x=$('#e');x&&(x.textContent=m)};
if(d.book)return openBook(+d.book);if(d.svc){bk.svc=d.svc;location.hash='#find';toast('Now pick your Tech Buddy');return}

if(d.acc||d.rej){reqs=reqs.filter(r=>r.id!==(d.acc||d.rej));toast(d.acc?'Request accepted':'Request declined');return render()}
if(d.t){const off=t.style.opacity!=='.5';t.style.opacity=off?'.5':'1';toast(d.t+(off?' off':' on'))}
if(t.id==='share'){if(confirm('Share your screen with your Tech Buddy? You can stop any time.')){$('#ss').textContent='You are sharing your screen. Press End to stop.';toast('Screen sharing started by you')}}
if(d.hasOwnProperty('end')){toast('Session ended. Please rate your Tech Buddy.');location.hash='#senior'}});
$('#lang').onchange=e=>{lang=e.target.value;render()};let z=0;$('#fs').onclick=()=>{z=(z+1)%3;document.documentElement.style.setProperty('--fs',[17,20,23][z]+'px')};

render();
